name: Deploy to Shin-Free via SSH

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOSTNAME }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: 10022
          SOURCE: dist/
          TARGET: /home/${{ secrets.SSH_USERNAME }}/kuratani-portfolio.work/public_html/
          ARGS: '-avzr'

      # デプロイ後に公開URLへ接続できるか確認
      - name: Check Website
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 5 \
            --max-time 30 \
            https://kuratani-portfolio.work/
